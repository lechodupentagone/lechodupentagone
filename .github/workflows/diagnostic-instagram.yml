name: Diagnostic Instagram
on: workflow_dispatch
jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          t = os.environ.get("IG_TOKEN", ""); u = os.environ.get("IG_USER_ID", "")
          print("Jeton : longueur", len(t), "| début", repr(t[:4]),
                "| espaces/retours", any(c.isspace() for c in t), "| guillemets", any(c in t for c in "\"'"))
          print("IG_USER_ID : longueur", len(u), "| que des chiffres", u.strip().isdigit())
          t = t.strip().strip('"\'')
          url = "https://graph.instagram.com/v25.0/me?" + urllib.parse.urlencode(
              {"fields": "user_id,username", "access_token": t})
          try:
              r = json.load(urllib.request.urlopen(url))
              print("Compte vu par Instagram :", r.get("username"), "| user_id identique :", r.get("user_id") == u.strip())
          except urllib.error.HTTPError as e:
              print("Erreur Instagram :", e.read().decode()[:300])
          for chemin, champs in (("me", "id,name"), (u.strip(), "id,username"), ("me/permissions", "")):
              q = {"access_token": t}
              if champs: q["fields"] = champs
              try:
                  r = json.load(urllib.request.urlopen(f"https://graph.facebook.com/v25.0/{chemin}?" + urllib.parse.urlencode(q)))
                  if chemin == "me/permissions":
                      r = [p["permission"] for p in r.get("data", []) if p.get("status") == "granted"]
                  elif chemin == "me":
                      r = {"type": "compte Facebook"}
                  print("Facebook", "/compte-IG" if chemin == u.strip() else "/" + chemin, ":", r)
              except urllib.error.HTTPError as e:
                  print("Facebook", chemin[:3], ": erreur", e.read().decode()[:200])
          PY
