name: Collecte
on:
  schedule:
    - cron: "15 5-21/2 * * *"      # toutes les 2 h de 6 h à 22 h (heure de Paris, hiver)
  workflow_dispatch:
permissions:
  contents: write
concurrency: depot
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Collecter
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python scripts/collect.py
      - name: Enregistrer l'état et les PDF archivés
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data archives
          git diff --cached --quiet || (git commit -m "Collecte $(date +'%F %H:%M')" && git push)
